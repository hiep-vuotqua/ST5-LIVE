name: ST5 V1.8 5M VALIDATION

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: st5-v18-validation
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V1.8 5M Validation
        run: |
          PYTHONPATH=Scr python Scr/v18_validation.py 
