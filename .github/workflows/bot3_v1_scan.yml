name: Bot 3 V1 Live Intraday Scanner

on:
  schedule:
    # Khung sáng VN (09:15 - 11:30) = UTC (02:15 - 04:30) - Chạy 15 phút/lần
    - cron: '15,30,45 2 * * 1-5'
    - cron: '0,15,30,45 3 * * 1-5'
    - cron: '0,15,30 4 * * 1-5'
    # Khung chiều VN (13:00 - 14:30) = UTC (06:00 - 07:30) - Chạy 15 phút/lần
    - cron: '0,15,30,45 6 * * 1-5'
    - cron: '0,15,30 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install vnstock pandas numpy requests

      - name: Run Market Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Scr/bot3_v1_scanner.py
 
