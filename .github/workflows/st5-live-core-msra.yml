name: Run CORE-MSRA

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1-5'   # 09:15 VN
    - cron: '0  3 * * 1-5'   # 10:00 VN
    - cron: '0  4 * * 1-5'   # 11:00 VN
    - cron: '0  6 * * 1-5'   # 13:00 VN
    - cron: '30 6 * * 1-5'   # 13:30 VN
    - cron: '30 7 * * 1-5'   # 14:30 VN

jobs:
  run-st5-live-core-msra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade pandas numpy requests pytz

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit state & cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ cache_data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update state & cache [skip ci]"
          git push || true 
