name: Run CORE-MSRA

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1-5'
    - cron: '0  3 * * 1-5'
    - cron: '0  4 * * 1-5'
    - cron: '0  6 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '30 7 * * 1-5'

jobs:
  run-msra:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install --upgrade pip pandas numpy requests pytz
      - name: Find and run main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          find . -name "*.py" -not -path "./.git/*"
          MAIN=$(find . -name "main.py" -not -path "./.git/*" | head -1)
          if [ -z "$MAIN" ]; then exit 1; fi
          cd "$(dirname "$MAIN")"
          python main.py
      - name: Commit
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@x.com
          git add -A
          git diff --staged --quiet || git commit -m "state [skip ci]"
          git push || true 
