name: Run CORE-MSRA

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1-5'

jobs:
  run-msra:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade pandas numpy requests vnstock
      
      - name: Run script with retry
        run: |
          for i in 1 2 3 4 5; do
            echo "🔄 Lần chạy $i/5..."
            python main.py && echo "✅ Thành công!" && break
            echo "⚠️ Lần $i thất bại, chờ 60s trước khi thử lại..."
            sleep 60
          done
