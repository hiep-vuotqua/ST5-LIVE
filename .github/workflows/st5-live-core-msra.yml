name: ST5-LIVE CORE-MSRA

on:
  schedule:
    # 14:45 VN = 07:45 UTC
    - cron: '45 7 * * 1-5'
    # 15:15 VN = 08:15 UTC
    - cron: '15 8 * * 1-5'
  workflow_dispatch:

jobs:
  run-msra:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install --quiet vnstock pandas numpy requests

      - name: Run CORE-MSRA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: Scr
        run: python main_core_msra.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_state_core_msra.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Update CORE-MSRA live state [skip ci]"
          git push 
