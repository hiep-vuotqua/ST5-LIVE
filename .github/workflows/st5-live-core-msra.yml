name: Run CORE-MSRA

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1-5'
    - cron: '0  3 * * 1-5'
    - cron: '0  4 * * 1-5'
    - cron: '0  6 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '30 7 * * 1-5'

jobs:
  run-msra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install --upgrade pip pandas numpy requests pytz

      - name: Run MSRA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd Scr
          python main_core_msra.py

      - name: Commit state & cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Update state & cache [skip ci]"
          git push || true
