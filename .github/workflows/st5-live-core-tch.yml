name: ST5 LIVE CORE-TCH

on:
  schedule:
    # Sáng VN 09:15-11:30 = UTC 02:15-04:30
    - cron: "15-55/5 2 * * 1-5"
    - cron: "*/5 3 * * 1-5"
    - cron: "0-30/5 4 * * 1-5"
    # Chiều VN 13:00-14:30 = UTC 06:00-07:30
    - cron: "*/5 6 * * 1-5"
    - cron: "0-30/5 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: st5-live-core-tch
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt

      - name: Run ST5 CORE-TCH
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd Scr
          python main_core_tch.py

      - name: Commit state
        run: |
          git config user.name "ST5 Bot"
          git config user.email "bot@st5.local"
          git add data/live_state_core_tch.json
          git diff --staged --quiet || git commit -m "Update CORE-TCH state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
