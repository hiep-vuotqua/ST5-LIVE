name: ST5 LIVE

on:

  workflow_dispatch:

    inputs:

      telegram_test:
        description: "Test Telegram"
        required: false
        default: "false"

  schedule:

    # 09:15 - 11:30 Vietnam
    # UTC 02:15 - 04:30

    - cron: "15-55/5 2 * * 1-5"
    - cron: "*/5 3 * * 1-5"
    - cron: "0-30/5 4 * * 1-5"

    # 13:00 - 14:30 Vietnam
    # UTC 06:00 - 07:30

    - cron: "*/5 6 * * 1-5"
    - cron: "0-30/5 7 * * 1-5"


permissions:
  contents: write


concurrency:

  group: st5-live

  cancel-in-progress: false


jobs:

  live:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Run ST5 LIVE

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          TELEGRAM_TEST: ${{ inputs.telegram_test == 'true' && '1' || '0' }}

        run: |

          PYTHONPATH=Scr python Scr/main.py


      - name: Show LIVE state

        if: always()

        run: |

          echo "=== LIVE STATE ==="

          if [ -f data/live_state.json ]; then

            cat data/live_state.json

          else

            echo "{}"

          fi


      - name: Save LIVE state

        if: always()

        run: |

          if [ ! -f data/live_state.json ]; then

            echo "No state file."

            exit 0

          fi


          git config user.name "ST5-LIVE Bot"

          git config user.email "st5-live-bot@users.noreply.github.com"


          git add data/live_state.json


          if git diff --cached --quiet; then

            echo "No state changes."

            exit 0

          fi


          git commit -m "Update ST5 LIVE state"

          git push
