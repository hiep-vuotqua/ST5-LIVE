name: ST5 LIVE CORE-28

on:
  schedule:
    - cron: "0 4 * * 1-5"     # 11:00 VN
    - cron: "0 7 * * 1-5"     # 14:00 VN
  workflow_dispatch:

concurrency:
  group: st5-live-core-28
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -q -r requirements.txt
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd Scr
          python main_core_28.py
      - name: Commit state
        run: |
          git config user.name "ST5 Bot"
          git config user.email "bot@st5.local"
          STATE_FILE="data/live_state_core_28.json"
          if [ ! -f "$STATE_FILE" ]; then echo "{}" > "$STATE_FILE"; fi
          git add "$STATE_FILE"
          git diff --staged --quiet || git commit -m "Update CORE-28 state $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
