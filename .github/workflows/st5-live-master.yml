2name: ST5 LIVE MASTER

on:
  workflow_dispatch: # Nút bấm chạy thủ công
  schedule:
    # --- PHIÊN SÁNG (Giờ VN) ---
    - cron: '25 2 * * 1-5'  # 09:25 VN (02:25 UTC)
    - cron: '30 3 * * 1-5'  # 10:30 VN (03:30 UTC)
    - cron: '15 4 * * 1-5'  # 11:15 VN (04:15 UTC)
    
    # --- PHIÊN CHIỀU (Giờ VN) ---
    - cron: '25 6 * * 1-5'  # 13:25 VN (06:25 UTC)
    - cron: '55 6 * * 1-5'  # 14:00 VN (06:55 UTC - bù trừ delay GitHub)
    - cron: '15 7 * * 1-5'  # 14:20 VN (07:15 UTC - bù trừ delay GitHub)
    - cron: '35 7 * * 1-5'  # 14:40 VN (07:35 UTC)

concurrency:
  group: st5-live-master
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytz numpy yfinance
          
      - name: Run master
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }} # <--- THÊM DÒNG NÀY
        run: |
          cd Scr
          python main_master.py
          
      - name: Commit state
        continue-on-error: true
        run: |
          git config user.name "ST5 Bot"
          git config user.email "bot@st5.local"
          STATE_FILE="data/live_state_master.json"
          if [ ! -f "$STATE_FILE" ]; then echo "{}" > "$STATE_FILE"; fi
          git add "$STATE_FILE"
          git diff --staged --quiet || git commit -m "Update MASTER state $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            echo "=== Push attempt $i/3 ==="
            git pull --rebase -X theirs origin main && break
            echo "Rebase failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          git push || echo "Push failed after 3 attempts"
