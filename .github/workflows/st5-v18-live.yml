name: ST5 V1.8 LIVE

on:
  workflow_dispatch:

  schedule:
    # 09:15 -> 09:55 Vietnam
    - cron: "15-55/5 2 * * 1-5"

    # 10:00 -> 10:55 Vietnam
    - cron: "*/5 3 * * 1-5"

    # 11:00 -> 11:30 Vietnam
    - cron: "0-30/5 4 * * 1-5"

    # 13:00 -> 13:55 Vietnam
    - cron: "*/5 6 * * 1-5"

    # 14:00 -> 14:30 Vietnam
    - cron: "0-30/5 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: st5-live-v18
  cancel-in-progress: false

jobs:
  v18-live:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V1.8 LIVE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=Scr python Scr/v18_main.py

      - name: Show V1.8 state
        if: always()
        run: |
          echo "===== V1.8 STATE ====="
          if [ -f data/v18_live_state.json ]; then
            cat data/v18_live_state.json
          else
            echo "No state file"
          fi

      - name: Commit V1.8 state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/v18_live_state.json

          git diff --cached --quiet || \
            git commit -m "Update V1.8 live state"

          git push
