name: Run CORE-DGW

on:
  workflow_dispatch:

  schedule:
    # 14:45 Vietnam = 07:45 UTC
    - cron: '45 7 * * 1-5'

    # 15:15 Vietnam = 08:15 UTC
    - cron: '15 8 * * 1-5'

jobs:
  run-dgw:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pytz vnstock

      - name: Run CORE-DGW
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd Scr
          python main_core_dgw.py

      - name: Commit state & cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --staged --quiet || git commit -m "Update CORE-DGW state & cache [skip ci]"

          git push || true 
