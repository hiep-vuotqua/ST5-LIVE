name: ST5 HIEP-SCAN

on:
  workflow_dispatch:
  schedule:
    # --- SÁNG (Né 9h-9h30 của Bot Master) ---
    - cron: '45 2 * * 1-5'  # 09:45 VN
    - cron: '15 3 * * 1-5'  # 10:15 VN
    - cron: '0 4 * * 1-5'   # 11:00 VN
    
    # --- CHIỀU (So le các Bot khác) ---
    - cron: '0 6 * * 1-5'   # 13:00 VN
    - cron: '45 6 * * 1-5'  # 13:45 VN
    - cron: '15 7 * * 1-5'  # 14:15 VN
    - cron: '45 7 * * 1-5'  # 14:45 VN

concurrency:
  group: st5-hiep-scan
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytz numpy
          
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd Scr
          python main_hiep_scan.py
          
      - name: Commit state
        continue-on-error: true
        run: |
          git config user.name "ST5 Bot"
          git config user.email "bot@st5.local"
          STATE_FILE="Scr/live_state_hiep_scan.json"
          if [ ! -f "$STATE_FILE" ]; then echo "{}" > "$STATE_FILE"; fi
          git add "$STATE_FILE"
          git diff --staged --quiet || git commit -m "Update HIEP-SCAN state $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            echo "=== Push attempt $i/3 ==="
            git pull --rebase -X theirs origin main && break
            echo "Rebase failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          git push || echo "Push failed after 3 attempts"
